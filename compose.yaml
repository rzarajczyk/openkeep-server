name: openkeep

services:
  app:
    build:
      context: .
    image: openkeep:latest
    restart: unless-stopped
    init: true
    ports:
      - "${OPENKEEP_PORT:-8080}:8080"
    environment:
      OPENKEEP_DATABASE_URL: "${OPENKEEP_DATABASE_URL:?Set OPENKEEP_DATABASE_URL in .env}"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "${OPENKEEP_ATTACHMENT_MAX_FILE_SIZE:-26214400}B"
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "${OPENKEEP_MULTIPART_MAX_REQUEST_SIZE:-27262976}B"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OPENKEEP_ADMIN_USERNAME: "${OPENKEEP_ADMIN_USERNAME:?Set OPENKEEP_ADMIN_USERNAME in .env}"
      OPENKEEP_ADMIN_PASSWORD: "${OPENKEEP_ADMIN_PASSWORD:?Set OPENKEEP_ADMIN_PASSWORD in .env}"
      OPENKEEP_TOKEN_TTL: "${OPENKEEP_TOKEN_TTL:-PT24H}"
      OPENKEEP_ATTACHMENT_STORAGE_ROOT: /data/attachments
      OPENKEEP_ATTACHMENT_MAX_FILE_SIZE: "${OPENKEEP_ATTACHMENT_MAX_FILE_SIZE:-26214400}"
      OPENKEEP_ATTACHMENT_PER_USER_QUOTA: "${OPENKEEP_ATTACHMENT_PER_USER_QUOTA:-1073741824}"
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      OPENKEEP_DATABASE_URL: "${OPENKEEP_DATABASE_URL:?Set OPENKEEP_DATABASE_URL in .env}"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/postgres-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres:
    name: openkeep-postgres
  attachments:
    name: openkeep-attachments
