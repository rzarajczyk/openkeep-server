name: CI

on:
  push:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

  # Publishes ownkeep-core to Docker Hub only. Hosted GCP deploy lives in ownkeep-saas.
  docker:
    name: Publish image
    needs: [api-tests, web-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag_now: ${{ steps.meta.outputs.tag_now }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names
        id: meta
        run: |
          APP_NAME=$(grep -E '^name:' compose.yaml | awk '{print $2}')
          TAG_NOW=$(date +'%Y-%m-%d-%H-%M-%S')
          VERSION=$(grep -E '^version' api/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${APP_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_now=${TAG_NOW}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: docker
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${{ steps.meta.outputs.version }},${IMAGE}:${{ steps.meta.outputs.tag_now }}" >> "$GITHUB_OUTPUT"

      - name: Build and push core image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  saas-rebuild:
    name: Rebuild ownkeep-saas
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ownkeep-saas rebuild
        env:
          SAAS_DISPATCH_TOKEN: ${{ secrets.SAAS_DISPATCH_TOKEN }}
          CORE_IMAGE: docker.io/${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag_now }}
          CORE_VERSION: ${{ needs.docker.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SAAS_DISPATCH_TOKEN}" ]; then
            echo "::error::SAAS_DISPATCH_TOKEN secret is not configured; cannot trigger ownkeep-saas rebuild." >&2
            exit 1
          fi
          GH_TOKEN="$SAAS_DISPATCH_TOKEN" gh api --method POST repos/rzarajczyk/ownkeep-saas/dispatches \
            -f event_type='core-image-published' \
            -f "client_payload[core_image]=${CORE_IMAGE}" \
            -f "client_payload[core_ref]=${{ github.sha }}" \
            -f "client_payload[core_version]=${CORE_VERSION}"
